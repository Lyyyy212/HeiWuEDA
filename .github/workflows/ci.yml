name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and pinned upstream repositories
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Scan public release boundary
        run: node materials/scripts/scan-public-release.mjs

      - name: Install gateway
        run: python -m pip install ./packages/easyeda-gateway

      - name: Install gateway render runtime
        run: |
          render_runtime="$RUNNER_TEMP/gateway-render-runtime"
          npm install --prefix "$render_runtime" --no-save --no-package-lock playwright@1.62.1
          "$render_runtime/node_modules/.bin/playwright" install --with-deps chromium
          echo "JLC_NODE_EXECUTABLE=$(command -v node)" >> "$GITHUB_ENV"
          echo "JLC_NODE_PATH=$render_runtime/node_modules" >> "$GITHUB_ENV"

      - name: Test gateway
        run: python -m unittest discover -s packages/easyeda-gateway/tests -t packages/easyeda-gateway -v

      - name: Build gateway wheel
        run: python -m pip wheel --no-deps --wheel-dir dist ./packages/easyeda-gateway

      - name: Verify gateway wheel licenses
        run: python scripts/release/verify_wheel.py dist/easyeda_workbench_gateway-0.8.0-py3-none-any.whl

      - name: Install 黑五EDA Gateway extension dependencies
        working-directory: integrations/zhiyuaneda-gateway
        run: npm ci

      - name: Test and package 黑五EDA Gateway extension
        working-directory: integrations/zhiyuaneda-gateway
        run: npm run quality

      - name: Install 黑五EDA protocol-v2 workbench extension dependencies
        working-directory: integrations/heiwu-workbench-extension
        run: npm ci

      - name: Test and package 黑五EDA protocol-v2 workbench extension
        working-directory: integrations/heiwu-workbench-extension
        run: npm run quality

      - name: Test lifecycle
        working-directory: skills/easyeda-hardware-lifecycle/scripts
        run: python -m unittest discover -s tests -v

      - name: Validate learning contracts
        run: node materials/scripts/validate-learning-design.mjs

      - name: Validate learning integration
        run: node materials/scripts/validate-jlc-hardware-learning-integration.mjs

      - name: Validate packaged learning plugin
        run: node materials/scripts/validate-jlc-hardware-learning-plugin.mjs integrations/jlc-hardware-learning-plugin

      - name: Install learning plugin dependencies
        working-directory: integrations/jlc-hardware-learning-plugin
        run: npm ci

      - name: Test and rebuild learning plugin
        working-directory: integrations/jlc-hardware-learning-plugin
        run: npm run quality
