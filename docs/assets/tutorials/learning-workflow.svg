<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ZhiYuanEDA 硬件学习工作流示意</title>
  <desc id="desc">从当前 EDA 图页的受控读取，经官方证据、学习画板和结构化问答，最终进入飞书学习笔记的无敏教学流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071c35"/><stop offset="1" stop-color="#102d4b"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153b5d"/><stop offset="1" stop-color="#0d2945"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#5eead4"/></marker>
    <style>
      .title { font: 700 43px 'Segoe UI','Microsoft YaHei',sans-serif; fill:#f8fafc; }
      .subtitle { font: 400 21px 'Segoe UI','Microsoft YaHei',sans-serif; fill:#b9d5e8; }
      .n { font: 700 26px 'Segoe UI','Microsoft YaHei',sans-serif; fill:#072238; }
      .h { font: 700 28px 'Segoe UI','Microsoft YaHei',sans-serif; fill:#f8fafc; }
      .p { font: 400 20px 'Segoe UI','Microsoft YaHei',sans-serif; fill:#c9e4f1; }
      .small { font: 400 17px 'Segoe UI','Microsoft YaHei',sans-serif; fill:#9dc6dd; }
      .chip { font: 600 17px 'Segoe UI','Microsoft YaHei',sans-serif; fill:#d9fbf4; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="120" cy="100" r="180" fill="#0ea5e9" opacity=".08"/><circle cx="1510" cy="760" r="270" fill="#2dd4bf" opacity=".07"/>
  <text x="90" y="100" class="title">硬件学习链：从正式证据到可检索笔记</text>
  <text x="90" y="140" class="subtitle">公开教程示意 · 默认只读 · 不包含真实工程、项目标识或导出设计</text>
  <g filter="url(#shadow)">
    <rect x="90" y="230" width="250" height="390" rx="24" fill="url(#card)" stroke="#2e6387"/>
    <rect x="390" y="230" width="250" height="390" rx="24" fill="url(#card)" stroke="#2e6387"/>
    <rect x="690" y="230" width="250" height="390" rx="24" fill="url(#card)" stroke="#2e6387"/>
    <rect x="990" y="230" width="250" height="390" rx="24" fill="url(#card)" stroke="#2e6387"/>
    <rect x="1290" y="230" width="220" height="390" rx="24" fill="url(#card)" stroke="#2e6387"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="126" cy="266" r="25"/><circle cx="426" cy="266" r="25"/><circle cx="726" cy="266" r="25"/><circle cx="1026" cy="266" r="25"/><circle cx="1326" cy="266" r="25"/>
  </g>
  <text x="118" y="275" class="n">1</text><text x="418" y="275" class="n">2</text><text x="718" y="275" class="n">3</text><text x="1018" y="275" class="n">4</text><text x="1318" y="275" class="n">5</text>
  <text x="120" y="335" class="h">当前 EDA 图页</text>
  <text x="120" y="375" class="p">确认 Bridge 身份</text><text x="120" y="407" class="p">确认活动窗口</text><text x="120" y="439" class="p">绑定工程与图页</text>
  <rect x="120" y="500" width="185" height="40" rx="20" fill="#103e58"/><text x="145" y="527" class="chip">只读身份守卫</text>
  <text x="420" y="335" class="h">官方证据</text>
  <text x="420" y="375" class="p">受控 PDF / PNG 导出</text><text x="420" y="407" class="p">本地高清渲染</text><text x="420" y="439" class="p">摘要与页级网表</text>
  <rect x="420" y="500" width="170" height="40" rx="20" fill="#103e58"/><text x="445" y="527" class="chip">可追溯素材</text>
  <text x="720" y="335" class="h">学习画板</text>
  <text x="720" y="375" class="p">锁定原理图底图</text><text x="720" y="407" class="p">编号学习框</text><text x="720" y="439" class="p">选区表达问题</text>
  <rect x="720" y="500" width="170" height="40" rx="20" fill="#103e58"/><text x="744" y="527" class="chip">不改 EasyEDA</text>
  <text x="1020" y="335" class="h">结构化问答</text>
  <text x="1020" y="375" class="p">问题绑定学习框</text><text x="1020" y="407" class="p">补充图元与数据手册</text><text x="1020" y="439" class="p">事实、推断与未知项</text>
  <rect x="1020" y="500" width="170" height="40" rx="20" fill="#103e58"/><text x="1042" y="527" class="chip">可复核解释</text>
  <text x="1320" y="335" class="h">飞书笔记</text>
  <text x="1320" y="375" class="p">模块化文本</text><text x="1320" y="407" class="p">原生画板镜像</text><text x="1320" y="439" class="p">写后回读核验</text>
  <rect x="1320" y="500" width="145" height="40" rx="20" fill="#103e58"/><text x="1345" y="527" class="chip">长期沉淀</text>
  <path d="M345 425H380M645 425H680M945 425H980M1245 425H1280" stroke="#5eead4" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <rect x="90" y="700" width="1420" height="105" rx="22" fill="#0b2842" stroke="#2e6387"/>
  <text x="125" y="748" class="h" font-size="24">关键边界</text>
  <text x="125" y="780" class="small">学习画板负责可视化选区；官方证据负责事实依据；飞书负责检索与协作。任何设计修改都必须回到受控设计链。</text>
</svg>
